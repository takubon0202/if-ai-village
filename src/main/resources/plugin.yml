name: IFMineAI
version: '${version}'
main: com.ifmineai.IFMineAIPlugin
api-version: '1.21'
description: IF MineAI - AI NPC Counselor Plugin
authors:
  - IFMineAI

commands:
  counselor:
    description: NPC管理コマンド - NPCのスポーン・削除・一覧
    usage: /counselor <spawn|remove|list|help>
    aliases: [npc]
    permission: ifmineai.counselor.spawn
  ainpc:
    description: AI管理コマンド - AI状態・設定・デバッグ
    usage: /ainpc <help|status|setkey|enable|disable|reload|debug|personality|stats>
    permission: ifmineai.ai.admin
  mineai:
    description: IF MineAI 総合メニュー・ヘルプ・ガイド
    usage: /mineai [help|guide|setup|commands|about]
    aliases: [ifmineai, mai]
    permission: ifmineai.use

permissions:
  ifmineai.use:
    description: IF MineAIの基本コマンドを使用
    default: true
  ifmineai.counselor.spawn:
    description: NPCのスポーン・削除が可能
    default: op
  ifmineai.counselor.use:
    description: NPCとの対話が可能 (右クリック)
    default: true
  ifmineai.ai.admin:
    description: AI管理コマンドを使用
    default: op
